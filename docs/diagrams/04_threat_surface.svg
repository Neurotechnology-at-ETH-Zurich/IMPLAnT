<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img"
     aria-label="Five findings pinned onto the pipeline strip. Warning: SSH connects with AutoAddPolicy, no host key verification. Danger: animal_id is concatenated unescaped into a remote exec_command shell string in data_fetcher.py, a command injection into the Bruker host. Warning: raw_base plus animal_id is a plain string concatenation with no path sanitization. Warning: bruker_info.json stores the server password in plaintext, mitigated by being gitignored. Verified control: the downloaded atlas bundle is checked against a pinned SHA-256 hash before use.">
  <style>
    text{font-family:'IBM Plex Mono','Courier New',monospace;}
    .node{fill:#FFFFFF;stroke:#8FA1C4;stroke-width:1.5;}
    .well{fill:#E2E9F2;stroke:#8FA1C4;stroke-width:1.5;}
    .flowline{stroke:#0E8C89;stroke-width:1.75;fill:none;}
    .leader-warn{stroke:#B5730A;stroke-width:1.3;stroke-dasharray:3 3;fill:none;}
    .leader-danger{stroke:#C1393E;stroke-width:1.3;stroke-dasharray:3 3;fill:none;}
    .leader-ok{stroke:#2E8B57;stroke-width:1.3;stroke-dasharray:3 3;fill:none;}
    .ink-t{fill:#12213D;}
    .dim-t{fill:#57678C;}
    .card{fill:#E2E9F2;stroke:#C4D0E3;stroke-width:1.25;}
    .stripe-warn{fill:#B5730A;}
    .stripe-danger{fill:#C1393E;}
    .stripe-ok{fill:#2E8B57;}
  </style>
  <rect x="0" y="0" width="1080" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="ar-flow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E8C89"/>
    </marker>
  </defs>

  <g>
    <rect x="20" y="20" width="150" height="52" rx="3" class="well"/>
    <text x="95" y="51" text-anchor="middle" font-size="11.5" font-weight="600" class="ink-t">BRUKER HOST</text>
  </g>
  <g>
    <rect x="210" y="20" width="150" height="52" rx="3" class="node"/>
    <text x="285" y="51" text-anchor="middle" font-size="11.5" font-weight="600" class="ink-t">FETCH</text>
  </g>
  <g>
    <rect x="400" y="20" width="150" height="52" rx="3" class="node"/>
    <text x="475" y="51" text-anchor="middle" font-size="11.5" font-weight="600" class="ink-t">CONVERT</text>
  </g>
  <g>
    <rect x="590" y="20" width="230" height="52" rx="3" class="node"/>
    <text x="705" y="51" text-anchor="middle" font-size="11.5" font-weight="600" class="ink-t">REGISTER + STORE</text>
  </g>
  <line x1="170" y1="46" x2="207" y2="46" class="flowline" marker-end="url(#ar-flow4)"/>
  <line x1="360" y1="46" x2="397" y2="46" class="flowline" marker-end="url(#ar-flow4)"/>
  <line x1="550" y1="46" x2="587" y2="46" class="flowline" marker-end="url(#ar-flow4)"/>

  <polyline points="190,46 190,150 120,150 120,278" class="leader-warn" fill="none"/>
  <circle cx="190" cy="46" r="4" fill="#B5730A"/>

  <polyline points="260,72 260,150 330,150 330,278" class="leader-danger" fill="none"/>
  <circle cx="260" cy="72" r="4" fill="#C1393E"/>

  <polyline points="330,72 330,110 540,110 540,278" class="leader-warn" fill="none"/>
  <circle cx="330" cy="72" r="4" fill="#B5730A"/>

  <polyline points="285,20 285,4 750,4 750,278" class="leader-warn" fill="none"/>
  <circle cx="285" cy="20" r="4" fill="#B5730A"/>

  <polyline points="705,72 705,150 960,150 960,278" class="leader-ok" fill="none"/>
  <circle cx="705" cy="72" r="4" fill="#2E8B57"/>

  <g>
    <rect x="25" y="280" width="190" height="150" rx="3" class="card"/>
    <rect x="25" y="280" width="6" height="150" class="stripe-warn"/>
    <path d="M53 300 L64 322 L42 322 Z" fill="none" stroke="#B5730A" stroke-width="2" stroke-linejoin="round"/>
    <text x="53" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#B5730A">!</text>
    <text x="42" y="345" font-size="11.5" font-weight="600" class="ink-t">SSH: AutoAddPolicy</text>
    <text x="42" y="362" font-size="9.5" class="dim-t">no host-key check —</text>
    <text x="42" y="376" font-size="9.5" class="dim-t">MITM can impersonate</text>
    <text x="42" y="390" font-size="9.5" class="dim-t">the Bruker host</text>
    <text x="42" y="410" font-size="8.5" class="dim-t">data_fetcher.py:32</text>
  </g>

  <g>
    <rect x="235" y="280" width="190" height="150" rx="3" class="card"/>
    <rect x="235" y="280" width="6" height="150" class="stripe-danger"/>
    <circle cx="263" cy="311" r="11" fill="none" stroke="#C1393E" stroke-width="2"/>
    <line x1="255" y1="303" x2="271" y2="319" stroke="#C1393E" stroke-width="2"/>
    <text x="252" y="345" font-size="11.5" font-weight="600" class="ink-t">animal_id &#8594; shell</text>
    <text x="252" y="362" font-size="9.5" class="dim-t">unescaped string into</text>
    <text x="252" y="376" font-size="9.5" class="dim-t">exec_command() — command</text>
    <text x="252" y="390" font-size="9.5" class="dim-t">injection on the host PC</text>
    <text x="252" y="410" font-size="8.5" class="dim-t">data_fetcher.py:38</text>
  </g>

  <g>
    <rect x="445" y="280" width="190" height="150" rx="3" class="card"/>
    <rect x="445" y="280" width="6" height="150" class="stripe-warn"/>
    <path d="M473 300 L484 322 L462 322 Z" fill="none" stroke="#B5730A" stroke-width="2" stroke-linejoin="round"/>
    <text x="473" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#B5730A">!</text>
    <text x="462" y="345" font-size="11.5" font-weight="600" class="ink-t">Unsanitized path</text>
    <text x="462" y="362" font-size="9.5" class="dim-t">raw_base_samri + animal_id</text>
    <text x="462" y="376" font-size="9.5" class="dim-t">— plain string concat,</text>
    <text x="462" y="390" font-size="9.5" class="dim-t">no traversal guard</text>
    <text x="462" y="410" font-size="8.5" class="dim-t">samri_main.py:88</text>
  </g>

  <g>
    <rect x="655" y="280" width="190" height="150" rx="3" class="card"/>
    <rect x="655" y="280" width="6" height="150" class="stripe-warn"/>
    <path d="M683 300 L694 322 L672 322 Z" fill="none" stroke="#B5730A" stroke-width="2" stroke-linejoin="round"/>
    <text x="683" y="318" text-anchor="middle" font-size="11" font-weight="700" fill="#B5730A">!</text>
    <text x="672" y="345" font-size="11.5" font-weight="600" class="ink-t">Plaintext credentials</text>
    <text x="672" y="362" font-size="9.5" class="dim-t">bruker_info.json stores the</text>
    <text x="672" y="376" font-size="9.5" class="dim-t">password unencrypted</text>
    <text x="672" y="390" font-size="9.5" class="dim-t">(mitigated: gitignored)</text>
    <text x="672" y="410" font-size="8.5" class="dim-t">samri_main.py:379</text>
  </g>

  <g>
    <rect x="865" y="280" width="190" height="150" rx="3" class="card"/>
    <rect x="865" y="280" width="6" height="150" class="stripe-ok"/>
    <path d="M884 312 L892 320 L906 302" fill="none" stroke="#2E8B57" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="882" y="345" font-size="11.5" font-weight="600" class="ink-t">Atlas bundle verified</text>
    <text x="882" y="362" font-size="9.5" class="dim-t">download is checked against</text>
    <text x="882" y="376" font-size="9.5" class="dim-t">a pinned SHA-256 before</text>
    <text x="882" y="390" font-size="9.5" class="dim-t">extraction — good pattern</text>
    <text x="882" y="410" font-size="8.5" class="dim-t">atlas_fetch.py:35</text>
  </g>
</svg>
