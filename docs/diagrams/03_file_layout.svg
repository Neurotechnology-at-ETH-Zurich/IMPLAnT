<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img"
     aria-label="Directory tree under raw_base_samri/animal id: a session/scan folder with acqp and 2dseq files, a bids folder containing sub-animal/ses-session with an anat folder and a registration folder holding the key output_Composite.h5 transform, and a results/generic_work folder with data_selection.csv and per-scan nipype node output folders. A dashed line shows output_Composite.h5's sibling subject folder gets copied to DATA/sub-animal id on a successful registration.">
  <style>
    text{font-family:'IBM Plex Mono','Courier New',monospace;}
    .node{fill:#FFFFFF;stroke:#8FA1C4;stroke-width:1.5;}
    .guide{stroke:#8FA1C4;stroke-width:1.2;fill:none;}
    .dashline{stroke:#57678C;stroke-width:1.2;stroke-dasharray:5 4;fill:none;}
    .ink-t{fill:#12213D;}
    .dim-t{fill:#57678C;}
    .accent-t{fill:#0E8C89;}
  </style>
  <rect x="0" y="0" width="840" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="ar-dim3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57678C"/>
    </marker>
  </defs>

  <line x1="32" y1="40" x2="32" y2="296" class="guide"/>
  <line x1="32" y1="58" x2="40" y2="58" class="guide"/>
  <line x1="32" y1="160" x2="40" y2="160" class="guide"/>
  <line x1="32" y1="296" x2="40" y2="296" class="guide"/>

  <line x1="64" y1="74" x2="64" y2="126" class="guide"/>
  <line x1="64" y1="92" x2="72" y2="92" class="guide"/>
  <line x1="64" y1="126" x2="72" y2="126" class="guide"/>

  <line x1="64" y1="176" x2="64" y2="194" class="guide"/>
  <line x1="64" y1="194" x2="72" y2="194" class="guide"/>

  <line x1="96" y1="210" x2="96" y2="262" class="guide"/>
  <line x1="96" y1="228" x2="104" y2="228" class="guide"/>
  <line x1="96" y1="262" x2="104" y2="262" class="guide"/>

  <line x1="64" y1="312" x2="64" y2="364" class="guide"/>
  <line x1="64" y1="330" x2="72" y2="330" class="guide"/>
  <line x1="64" y1="364" x2="72" y2="364" class="guide"/>

  <rect x="3" y="19" width="10" height="10" transform="rotate(45 8 24)" class="node"/>
  <text x="24" y="28" font-size="11.5" font-weight="600" class="ink-t">raw_base_samri/&lt;animal_id&gt;/</text>

  <rect x="35" y="53" width="10" height="10" transform="rotate(45 40 58)" class="node"/>
  <text x="56" y="62" font-size="11" class="ink-t">&lt;session&gt;/&lt;scan#&gt;/</text>

  <circle cx="72" cy="92" r="4" class="node"/>
  <text x="88" y="96" font-size="10.5" class="dim-t">acqp</text>

  <circle cx="72" cy="126" r="4" class="node"/>
  <text x="88" y="130" font-size="10.5" class="dim-t">pdata/1/2dseq</text>

  <rect x="35" y="155" width="10" height="10" transform="rotate(45 40 160)" class="node"/>
  <text x="56" y="164" font-size="11" class="ink-t">bids/</text>

  <rect x="67" y="189" width="10" height="10" transform="rotate(45 72 194)" class="node"/>
  <text x="88" y="198" font-size="11" class="ink-t">sub-&lt;animal_id&gt;/ses-&lt;session&gt;/</text>

  <circle cx="104" cy="228" r="4" class="node"/>
  <text x="120" y="232" font-size="10.5" class="dim-t">anat/*.nii.gz</text>

  <circle cx="104" cy="262" r="5" fill="#0E8C89" stroke="none"/>
  <text x="120" y="266" font-size="11" font-weight="600" class="accent-t">registration/output_Composite.h5</text>
  <text x="405" y="266" font-size="12" class="accent-t">&#9733;</text>

  <rect x="35" y="291" width="10" height="10" transform="rotate(45 40 296)" class="node"/>
  <text x="56" y="300" font-size="11" class="ink-t">results/generic_work/</text>

  <circle cx="72" cy="330" r="4" class="node"/>
  <text x="88" y="334" font-size="10.5" class="dim-t">data_selection.csv</text>

  <rect x="67" y="359" width="10" height="10" transform="rotate(45 72 364)" class="node"/>
  <text x="88" y="368" font-size="10.5" class="dim-t">_ind_type_&lt;idx&gt;/{s_register, s_warp}/</text>

  <rect x="560" y="238" width="260" height="58" rx="3" class="node"/>
  <text x="690" y="264" text-anchor="middle" font-size="12" font-weight="600" class="ink-t">DATA/sub-&lt;animal_id&gt;/</text>
  <text x="690" y="281" text-anchor="middle" font-size="9.5" class="dim-t">copy made after successful registration</text>

  <polyline points="425,262 520,262 520,266 558,266" class="dashline" fill="none" marker-end="url(#ar-dim3)"/>
  <text x="470" y="255" text-anchor="middle" font-size="9" class="dim-t">_copy_sub_to_data()</text>
</svg>
