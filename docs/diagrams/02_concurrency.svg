<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"
     aria-label="GUI main thread spawns one SamriWorker QThread at a time, running exactly one job: either the fetch job, which opens SSH/SCP to the Bruker host, or the bias-correct/register job. The register job's node graph is a strict sequential chain for the common case of one matching scan: N4BiasFieldCorrection, then antsRegistration, then antsApplyTransforms, one subprocess active at a time. A dashed note explains that real concurrency in the MultiProc pool only appears if the session has more than one scan matching the same acquisition and task, in which case nipype runs one independent chain per scan and their steps may overlap. Both jobs stream stdout and stderr back to the GUI thread's log panel. A footnote clarifies each job gets its own fresh SamriWorker instance, so fetch and register never run at the same time.">
  <style>
    text{font-family:'IBM Plex Mono','Courier New',monospace;}
    .node{fill:#FFFFFF;stroke:#8FA1C4;stroke-width:1.5;}
    .well{fill:#E2E9F2;stroke:#8FA1C4;stroke-width:1.5;}
    .accent-node{fill:#FFFFFF;stroke:#0E8C89;stroke-width:1.75;}
    .guide{stroke:#8FA1C4;stroke-width:1.2;fill:none;}
    .flowline{stroke:#0E8C89;stroke-width:1.75;fill:none;}
    .dashline{stroke:#57678C;stroke-width:1.2;stroke-dasharray:5 4;fill:none;}
    .ink-t{fill:#12213D;}
    .dim-t{fill:#57678C;}
    .accent-t{fill:#0E8C89;}
    .card{fill:#E2E9F2;stroke:#C4D0E3;stroke-width:1.25;}
  </style>
  <rect x="0" y="0" width="1000" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="ar-flow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E8C89"/>
    </marker>
    <marker id="ar-dim2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57678C"/>
    </marker>
    <marker id="ar-guide2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8FA1C4"/>
    </marker>
  </defs>

  <g>
    <rect x="330" y="20" width="340" height="58" rx="3" class="well"/>
    <text x="500" y="46" text-anchor="middle" font-size="13" font-weight="600" class="ink-t">GUI &#183; MAIN THREAD</text>
    <text x="500" y="63" text-anchor="middle" font-size="10" class="dim-t">Qt event loop &#183; plainTextEdit_SAMRI</text>
  </g>

  <line x1="500" y1="78" x2="500" y2="118" class="flowline" marker-end="url(#ar-flow2)"/>
  <text x="515" y="102" font-size="10" class="dim-t">SamriWorker(work)</text>

  <g>
    <rect x="330" y="120" width="340" height="58" rx="3" class="node"/>
    <text x="500" y="146" text-anchor="middle" font-size="13" font-weight="600" class="ink-t">SAMRIWORKER</text>
    <text x="500" y="163" text-anchor="middle" font-size="9" class="dim-t">QThread &#183; runs ONE job: start_bruker2_bids() / biascorrection() / start_registration()</text>
  </g>

  <text x="20" y="205" font-size="9" font-weight="700" class="dim-t">JOB: FETCH (sheet 1, stage 1)</text>
  <text x="240" y="205" font-size="9" font-weight="700" class="dim-t">JOB: BIAS-CORRECT / REGISTER (sheet 1, stages 2&#8211;4)</text>

  <g>
    <rect x="20" y="230" width="170" height="66" rx="3" class="well"/>
    <text x="105" y="257" text-anchor="middle" font-size="11" font-weight="600" class="ink-t">BRUKER HOST</text>
    <text x="105" y="273" text-anchor="middle" font-size="9.5" class="dim-t">PV6.0.1/data/mri/</text>
  </g>

  <!-- sequential ANTs chain: this is the real node graph for one scan -->
  <g>
    <rect x="220" y="230" width="190" height="66" rx="3" class="accent-node"/>
    <text x="315" y="256" text-anchor="middle" font-size="11" font-weight="600" class="ink-t">N4BiasFieldCorrection</text>
    <text x="315" y="272" text-anchor="middle" font-size="9" class="accent-t">s_biascorrect</text>
  </g>
  <g>
    <rect x="440" y="230" width="190" height="66" rx="3" class="accent-node"/>
    <text x="535" y="256" text-anchor="middle" font-size="11" font-weight="600" class="ink-t">antsRegistration</text>
    <text x="535" y="272" text-anchor="middle" font-size="9" class="accent-t">s_register</text>
  </g>
  <g>
    <rect x="660" y="230" width="190" height="66" rx="3" class="accent-node"/>
    <text x="755" y="256" text-anchor="middle" font-size="11" font-weight="600" class="ink-t">antsApplyTransforms</text>
    <text x="755" y="272" text-anchor="middle" font-size="9" class="accent-t">s_warp &#8212; register job only</text>
  </g>

  <polyline points="381,178 381,210 105,210 105,228" class="flowline" fill="none" marker-end="url(#ar-flow2)"/>
  <text x="383" y="197" font-size="9" class="dim-t">SSH/SCP &#183; start_bruker2_bids()</text>

  <polyline points="500,178 500,224 315,224 315,228" class="flowline" fill="none" marker-end="url(#ar-flow2)"/>
  <text x="500" y="219" text-anchor="middle" font-size="9" class="dim-t">get_s_scan &#183; Workflow.run(MultiProc)</text>
  <line x1="410" y1="263" x2="437" y2="263" class="flowline" marker-end="url(#ar-flow2)"/>
  <text x="423" y="253" text-anchor="middle" font-size="8" class="dim-t">one ANTs subprocess at a time</text>
  <line x1="630" y1="263" x2="657" y2="263" class="flowline" marker-end="url(#ar-flow2)"/>

  <!-- conditional: real concurrency only if >1 matching scan -->
  <polyline points="315,296 315,310 535,310 535,324" class="guide" stroke-dasharray="3 3" fill="none" marker-end="url(#ar-guide2)"/>
  <rect x="220" y="326" width="630" height="54" rx="0" class="well" stroke-dasharray="4 3"/>
  <text x="234" y="345" font-size="10" font-weight="600" class="ink-t">+ scan 2..N &#8212; only if the session has &gt;1 scan matching the same acquisition + task</text>
  <text x="234" y="360" font-size="9" class="dim-t">nipype runs each scan's own chain independently; MultiProc may overlap different</text>
  <text x="234" y="372" font-size="9" class="dim-t">scans' steps, up to the Threads-spinbox pool size</text>

  <!-- feedback loops -->
  <path d="M 105 230 C 60 150, 200 40, 330 60" class="dashline" fill="none" marker-end="url(#ar-dim2)"/>
  <path d="M 850 250 C 950 190, 900 55, 672 44" class="dashline" fill="none" marker-end="url(#ar-dim2)"/>
  <text x="770" y="150" font-size="9.5" class="dim-t">stdout/stderr &#8594; LogAdapter</text>

  <!-- leader annotation -->
  <polyline points="700,72 700,100 670,100 670,120" class="guide" stroke-dasharray="2 3" fill="none"/>
  <circle cx="670" cy="120" r="3" fill="#0E8C89"/>
  <rect x="700" y="20" width="270" height="52" rx="2" class="card"/>
  <text x="714" y="40" font-size="10" font-weight="600" class="ink-t">PATH / ANTSPATH</text>
  <text x="714" y="55" font-size="9.5" class="dim-t">set once, in InitSAMRI.__init__,</text>
  <text x="714" y="67" font-size="9.5" class="dim-t">before any subprocess forks</text>

  <!-- footer note -->
  <text x="500" y="400" text-anchor="middle" font-size="9.5" class="dim-t">For the common case (1 matching scan) these three ANTs steps run strictly sequentially — one subprocess active at a time; the pool only helps when &gt;1 scan matches.</text>
  <text x="500" y="416" text-anchor="middle" font-size="9.5" class="dim-t">Each job gets its own fresh SamriWorker instance — FETCH and REGISTER never run at the same time. n_procs is the &quot;Threads&quot; spinbox (1–8) &#183; on OOM, retries once at N/2.</text>
</svg>
