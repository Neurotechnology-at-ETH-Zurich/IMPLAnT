<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"
     aria-label="Two independent PyVista scenes both read from the same live TrajectoryPlanningMri state, with no import between them. Visualisation3D is an always-visible in-panel view with three QtInteractor plotters using a clipping plane to look like 2D slices, loading in parallel via a thread pool executor that still blocks its caller. TrajectoryPlanning3DWindow is a dockable window opened on demand, supporting live interactive shank nudging, with mesh rebuilds wrapped in a fake-async busy overlay. Both warp atlas-shaped mesh vertices into true MRI space using the same technique, leaving mesh cell data untouched.">
  <style>
    text{font-family:'IBM Plex Mono','Courier New',monospace;}
    .node{fill:#FFFFFF;stroke:#8FA1C4;stroke-width:1.5;}
    .well{fill:#E2E9F2;stroke:#8FA1C4;stroke-width:1.5;}
    .accent-node{fill:#FFFFFF;stroke:#0E8C89;stroke-width:2;}
    .flowline{stroke:#8FA1C4;stroke-width:1.5;fill:none;}
    .ink-t{fill:#12213D;}
    .dim-t{fill:#57678C;}
    .danger-t{fill:#C1393E;}
  </style>
  <rect x="0" y="0" width="1000" height="380" fill="#FFFFFF"/>
  <defs>
    <marker id="ar1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8FA1C4"/></marker>
  </defs>

  <g><rect x="380" y="20" width="260" height="60" rx="3" class="well"/>
    <text x="510" y="45" text-anchor="middle" font-size="12" font-weight="600" class="ink-t">TrajectoryPlanningMri (live state)</text>
    <text x="510" y="60" text-anchor="middle" font-size="9" class="dim-t">self.MW.LoadMRI.TrajPlanning</text></g>

  <g><rect x="80" y="150" width="330" height="170" rx="3" class="accent-node"/>
    <text x="94" y="172" font-size="12" font-weight="700" class="ink-t">Visualisation3D <tspan font-size="9" fill="#57678C">(&#8594; VisualisationMri)</tspan></text>
    <text x="94" y="192" font-size="8.5" fill="#57678C">PyVista &#183; always-visible, in-panel</text>
    <text x="94" y="204" font-size="8.5" fill="#57678C">3 QtInteractor plotters (co/sa/ax),</text>
    <text x="94" y="216" font-size="8.5" fill="#57678C">clipping plane = looks like 2D slice</text>
    <text x="94" y="234" font-size="8.5" fill="#57678C">ThreadPoolExecutor(3) for parallel LOAD</text>
    <text x="94" y="246" font-size="8.5" fill="#57678C">only — still blocks caller, not GUI-async</text></g>

  <g><rect x="590" y="150" width="330" height="170" rx="3" class="accent-node"/>
    <text x="604" y="172" font-size="12" font-weight="700" class="ink-t">TrajectoryPlanning3DWindow</text>
    <text x="604" y="192" font-size="8.5" fill="#57678C">PyVista &#183; QDockWidget, opened on demand</text>
    <text x="604" y="204" font-size="8.5" fill="#57678C">(open_3d_window), reused after — not modal,</text>
    <text x="604" y="216" font-size="8.5" fill="#57678C">not a separate process</text>
    <text x="604" y="234" font-size="8.5" fill="#57678C">LIVE interactive shank nudging</text>
    <text x="604" y="246" font-size="8.5" fill="#57678C">(_nudge_shank, QTimer-coalesced)</text>
    <text x="604" y="258" font-size="8.5" fill="#57678C">mesh rebuild via BusyOverlay.run()</text></g>

  <line x1="450" y1="80" x2="270" y2="147" class="flowline" marker-end="url(#ar1)"/>
  <line x1="570" y1="80" x2="750" y2="147" class="flowline" marker-end="url(#ar1)"/>
  <line x1="410" y1="235" x2="587" y2="235" stroke="#C1393E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="500" y="228" text-anchor="middle" font-size="8.5" font-weight="700" class="danger-t">no import either direction</text>

  <text x="80" y="352" font-size="9.5" class="dim-t">Both warp atlas-shaped mesh vertices into true MRI space via the SAME atlas_points_to_mri_indices technique (coord_transform.py) — mesh cell</text>
  <text x="80" y="366" font-size="9.5" class="dim-t">data (region indices) stays untouched, only vertex positions move.</text>
</svg>
